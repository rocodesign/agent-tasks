name = "agent-tasks"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# No public hostname and no route. Every caller arrives through the shell at
# https://sidus.copaciu.com/api/fleet, which dispatches over its service binding.
workers_dev = false

# Both Durable Object namespaces were transferred to sidus-shell, which now owns their
# stored data and runs their code. The classes stay in src/ so this Worker keeps building,
# but the bindings below reach across to sidus-shell. The transfer is one way: never put
# a [[migrations]] block back, and never declare these classes live here again.
[exports.LiveState]
type = "durable-object"
state = "transferred"
transferred_to = "sidus-shell"

[exports.MachineRelay]
type = "durable-object"
state = "transferred"
transferred_to = "sidus-shell"

[[durable_objects.bindings]]
name = "LIVE_STATE"
class_name = "LiveState"
script_name = "sidus-shell"

# One relay per machine, carrying console frames to that machine's Codex app server. It
# writes nothing and hibernates between turns.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "MachineRelay"
script_name = "sidus-shell"

# Archive tier. Schema lives in drizzle/; apply with npm run db:migrate:remote.
[[d1_databases]]
binding = "DB"
database_name = "agent-tasks"
database_id = "80d73b10-696b-4a34-bfb5-28c3d7098120"
migrations_dir = "drizzle"

# The shell is the token issuer. Introspection goes over the binding, not the public
# hostname: a call arriving through the shell cannot reach back out to it over HTTP.
[[services]]
binding = "SHELL"
service = "sidus-shell"

# Workers AI binding, used only to reach the AI Search instance named in AI_SEARCH.
[ai]
binding = "AI"

# Knowledge store for AI Search: sessions/<slug>/<sessionId>.md written on enrich.
[[r2_buckets]]
binding = "KNOWLEDGE"
bucket_name = "majordomo-knowledge"

# Non-secret config (committed). Override per-env as needed.
[vars]
RESEND_FROM = "Fleet <fleet@copaciu.com>"
ALLOWED_EMAILS = "romeo@copaciu.com"
SHELL_URL = "https://sidus.copaciu.com"
AI_SEARCH = "majordomo-search"

# Secrets are NOT stored here.
#   local dev  -> .dev.vars
#   production -> wrangler secret put RESEND_API_KEY
#                 wrangler secret put BOOTSTRAP_API_KEY
